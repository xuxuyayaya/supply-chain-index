<details class="notes" id="method">
        <summary>评价口径与数据来源</summary>
        <p>
          发展总指数由物流保障、供应配套、供应韧性按 30%、40%、30% 合成。
          差距分析用于同类产业对标、改进清单与同口径复算。
          其中供应分由环节覆盖率、本地配套率、供应商集中度、龙头依赖度按
          30%、30%、20%、20% 加权。正向指标取百分数原值，逆向指标用 100
          减去原值。
        </p>
        <p>
          物流、经营与风险观测、同业对比数据采用情景测算，改进清单为当期研判建议。开封企业关系按各品类公开资料归集，集团采购、合作框架与车型适配保留各自披露口径。
        </p>
        <p id="data-channel"></p>
      </details>
