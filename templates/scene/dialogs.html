<dialog id="calculation-dialog" aria-labelledby="calculation-title">
      <div class="calculation-shell">
        <button type="button" id="calculation-close" aria-label="关闭计算说明">
          ×
        </button>
        <p id="calculation-context" class="section-kicker"></p>
        <h2 id="calculation-title"></h2>
        <div id="calculation-content"></div>
        <div id="calculation-actions"></div>
      </div>
    </dialog>
    <dialog id="record-dialog" aria-labelledby="record-title">
      <header class="record-header">
        <div><p class="record-context"></p><h2 id="record-title"></h2></div>
        <button type="button" class="record-close" aria-label="关闭数据录入">×</button>
      </header>
      <div class="record-body"></div>
      <p class="record-message" role="status"></p>
      <div class="record-footer"></div>
    </dialog>
